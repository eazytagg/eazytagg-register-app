name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.PDYNAMICS_TEST_KEYSTORE_B64 != '' }}
    permissions:
      contents: write
    concurrency:
      group: test-apk-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Restore persistent test signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          TEST_KEYSTORE: ${{ secrets.PDYNAMICS_TEST_KEYSTORE_B64 }}
        run: |
          if [ -z "$TEST_KEYSTORE" ]; then
            echo "::error::The persistent test signing key has not been configured."
            exit 1
          fi
          install -d -m 700 "$HOME/.android"
          printf '%s' "$TEST_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Test and build APK
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain --max-workers=2 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|Execution failed|Could not |error:|AAPT|Manifest merger" build.log | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
      - name: Prepare test APK
        env:
          APK_NAME: pdynamics-register-test.apk
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          apk=Path(os.environ['APK_NAME'])
          Path('build-info.json').write_text(json.dumps({'file':apk.name,'commit':os.environ['GITHUB_SHA'],'sha256':hashlib.sha256(apk.read_bytes()).hexdigest()}))
          PY
      - name: Publish test download
        if: github.ref == 'refs/heads/main' && env.HAS_SIGNING_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: pdynamics-register-test.apk
        run: |
          gh release view test-latest >/dev/null 2>&1 || gh release create test-latest --target "$GITHUB_SHA" --prerelease --title "PDynamics Reg — latest test build" --notes "For internal testing. Not a Play Store release."
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/test-latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          gh release upload test-latest "$APK_NAME" build-info.json --clobber
      - name: Keep existing signed download
        if: env.HAS_SIGNING_KEY != 'true'
        run: echo "::notice::Tests and build completed. The published, locally signed APK is kept. CI does not replace the download with a different signing identity."
      - uses: actions/upload-artifact@v4
        with:
          name: pdynamics-register-ci-validation-only
          path: app/build/outputs/apk/debug/*.apk
