name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|Execution failed|Could not |error:|AAPT|Manifest merger" build.log | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: eazytagg-register-debug-apk
          path: app/build/outputs/apk/debug/*.apk
